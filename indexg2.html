<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BH Locations Animated Page</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>

  <style>
    body {
      background-color: #fff;
      font-family: 'Poppins', sans-serif;
      overflow-x: hidden;
      padding: 60px 0;
    }

    .section-title {
      text-align: center;
      font-weight: 700;
      font-size: 2rem;
      margin-bottom: 50px;
    }

    .info-card {
      border-radius: 20px;
      padding: 30px;
      color: #fff;
      font-weight: 600;
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.1);
      transform: translateY(50px);
      opacity: 0;
    }

    .info-card.orange {
      background-color: #ff7b00;
    }

    .info-card.red {
      background-color: #ff3d3d;
    }

    .info-card.teal {
      background-color: #00bfbf;
    }

    .info-card.blue {
      background-color: #0077ff;
    }

    .info-card.green {
      background-color: #00b050;
    }

    .image-holder {
      overflow: hidden;
      border-radius: 30px;
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.15);
      transform: translateY(50px);
      opacity: 0;
    }

    .image-holder img {
      width: 100%;
      height: auto;
      display: block;
      transition: transform 0.6s ease;
    }

    .image-holder:hover img {
      transform: scale(1.1);
    }

    @media (min-width: 992px) {
      .staggered-row .col-lg-4:nth-child(odd) {
        margin-top: 80px;
      }
    }
  </style>
</head>

<body>
  <div class="container">
    <h1 class="section-title">YOUR ULTIMATE DESTINATION FOR ENTERTAINMENT</h1>

    <div class="row g-4 staggered-row align-items-center">
      <div class="col-lg-4 col-md-6">
        <div class="info-card orange text-center gsap-card" data-anim="left">
          <h2>220</h2>
          <p>Shops</p>
        </div>
      </div>

      <div class="col-lg-4 col-md-6">
        <div class="info-card red gsap-card" data-anim="bottom">
          <h5>Top F&B Spots</h5>
          <ul class="list-unstyled mt-3 mb-0">
            <li>Plume Wine Bar</li>
            <li>Henri</li>
            <li>Clos Maggiore</li>
            <li>Bancone</li>
          </ul>
        </div>
      </div>

      <div class="col-lg-4 col-md-6">
        <div class="image-holder gsap-card" data-anim="right">
          <img src="https://images.unsplash.com/photo-1486308510493-aa64833634ef?auto=format&fit=crop&w=800&q=80" alt="Entertainment">
        </div>
      </div>
    </div>

    <div class="row g-4 staggered-row align-items-center mt-4">
      <div class="col-lg-4 col-md-6">
        <div class="info-card teal text-center gsap-card" data-anim="right">
          <h2>44M+</h2>
          <p>Visitors Annually</p>
        </div>
      </div>

      <div class="col-lg-4 col-md-6">
        <div class="image-holder gsap-card" data-anim="top">
          <img src="https://images.unsplash.com/photo-1503264116251-35a269479413?auto=format&fit=crop&w=800&q=80" alt="City">
        </div>
      </div>

      <div class="col-lg-4 col-md-6">
        <div class="info-card red text-center gsap-card" data-anim="left">
          <h2>13</h2>
          <p>Theatres</p>
        </div>
      </div>
    </div>

    <div class="row g-4 staggered-row align-items-center mt-4">
      <div class="col-lg-4 col-md-6">
        <div class="image-holder gsap-card" data-anim="bottom">
          <img src="https://images.unsplash.com/photo-1506744038136-46273834b3fb?auto=format&fit=crop&w=800&q=80" alt="Shops">
        </div>
      </div>

      <div class="col-lg-4 col-md-6">
        <div class="info-card green text-center gsap-card" data-anim="right">
          <h2>11</h2>
          <p>Acres of Open Spaces</p>
        </div>
      </div>

      <div class="col-lg-4 col-md-6">
        <div class="info-card blue text-center gsap-card" data-anim="left">
          <h2>1.2</h2>
          <p>Miles of Riverside Walks</p>
        </div>
      </div>
    </div>
  </div>

  <script>
    gsap.registerPlugin(ScrollTrigger);

    document.querySelectorAll(".gsap-card").forEach((card, i) => {
      const animType = card.dataset.anim;
      let xVal = 0, yVal = 0;

      switch (animType) {
        case "left":
          xVal = -100;
          break;
        case "right":
          xVal = 100;
          break;
        case "top":
          yVal = -100;
          break;
        case "bottom":
          yVal = 100;
          break;
      }

      gsap.fromTo(card,
        { x: xVal, y: yVal, opacity: 0 },
        {
          x: 0, y: 0, opacity: 1,
          duration: 1.2,
          ease: "power3.out",
          scrollTrigger: {
            trigger: card,
            start: "top 80%",
            toggleActions: "play none none reverse"
          }
        });
    });
  </script>
</body>

</html>
